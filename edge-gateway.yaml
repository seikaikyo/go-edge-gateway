gateway:
  name: "demo-gateway"
  log_level: info
  health_port: 8080

# HTTP API. Defaults bind loopback only. /api requires a bearer token read from
# the environment variable named below, and refuses every request while unset.
api:
  listen: "127.0.0.1"
  token_env: "EDGE_GATEWAY_API_TOKEN"
  # Browser origins allowed besides same-origin. Empty means same-origin only.
  allowed_origins: []

# Scan API target allow list. Narrow this to the subnets holding your devices.
# Link-local (169.254.0.0/16) is refused whatever is listed here.
scan:
  allowed_targets:
    - "127.0.0.0/8"
    - "192.168.0.0/16"

coordinator:
  url: "https://dashai-go.onrender.com"
  node_id: "edge-gw-factory-a-01"
  location: "Factory A, Line 1"
  heartbeat_interval: "30s"

uplink:
  type: coordinator
  batch_interval: "5s"
  max_batch_size: 100

plugins:
  secsgem:
    enabled: false
    devices:
      - name: "etcher-01"
        host: 192.168.1.100
        port: 5000
        mode: passive
        device_id: 1

  modbus:
    enabled: true
    devices:
      - name: "temp-sensor-rack"
        host: 192.168.1.200
        port: 502
        unit_id: 1
        poll_interval: 1s
        registers:
          - name: "temperature"
            address: 0
            type: holding
            count: 1
            scale: 0.1
            unit: "celsius"
          - name: "humidity"
            address: 1
            type: holding
            count: 1
            scale: 0.1
            unit: "%"

  mqtt:
    enabled: false
    broker: "tcp://192.168.1.50:1883"
    subscriptions:
      - topic: "machines/+/status"
        device_pattern: "machines/{device}/status"
